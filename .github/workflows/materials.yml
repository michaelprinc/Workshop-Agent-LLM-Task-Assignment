name: Validate workshop materials
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  materials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_materials.py --distribution --history
      - run: python -m pytest balicek-technicke/projekt/znamkovy-kalkulator/tests/ -v -p no:cacheprovider
        env:
          PYTHONPATH: balicek-technicke/projekt/znamkovy-kalkulator
          PYTHONDONTWRITEBYTECODE: '1'
